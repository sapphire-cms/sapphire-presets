name: author
label: Author
description: Public editorial profile of a blog author
type: collection

fields:
  - name: name
    label: Name
    type: text
    required: true
    description: Public display name of the author

  - name: first-name
    label: First Name
    type: text
    description: Author's given name

  - name: last-name
    label: Last Name
    type: text
    description: Author's family name

  - name: pen-name
    label: Pen Name
    type: text
    description: Alternative name used for publication

  - name: pronouns
    label: Pronouns
    type: text
    description: Preferred pronouns

  - name: headline
    label: Headline
    type: text
    description: Short tagline displayed near the author's name

  - name: short-bio
    label: Short Bio
    type: text
    description: Short biography for article bylines and author cards

  - name: bio
    label: Bio
    type: rich-text
    description: Full author biography

  - name: avatar
    label: Avatar
    type: media
    description: Reference to the author's profile image

  - name: cover-image
    label: Cover Image
    type: media
    description: Reference to the author's profile banner

  - name: job-title
    label: Job Title
    type: text
    description: Professional title or occupation

  - name: organization
    label: Organization
    type: text
    description: Employer, institution or affiliation

  - name: expertise
    label: Expertise
    type: text
    isList: true
    description: Areas of expertise and specialization

  - name: location
    label: location
    type: text
    description: Publicly disclosed location

  - name: website
    label: Website
    type: text
    description: Personal or professional website URL

  - name: email
    label: Email
    type: text
    description: Public contact email address

  - name: social-links
    label: Social Links
    type: group
    isList: true
    description: Social profiles and external links
    fields:
      - name: platform
        label: Platform
        type: text
        required: true

      - name: url
        label: URL
        # TODO: change type to url
        type: text
        required: true

      - name: label
        label: Label
        type: text

  - name: featured
    label: Is Featured
    type: check
    description: Whether to highlight this author
